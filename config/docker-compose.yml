version: '3.8'
services:
  web:
    build: .
    ports:
      - "8555:8555"
    environment:
      - FLET_WEB_PORT=8555
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./:/app
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    restart: unless-stopped
